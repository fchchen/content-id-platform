services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ContentId_local_2026!
    ports:
      - "11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"select 1\" -C -b"]
      interval: 5s
      timeout: 5s
      retries: 20

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ContentId_local_2026!
    command:
      [
        "bash",
        "-c",
        "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"if db_id(N'contentid') is null create database contentid;\" -C -b"
      ]

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,sns,s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18889:8889"

  contentid-api:
    build:
      context: .
      dockerfile: src/ContentId.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ContentId__SqlServerConnectionString: Server=sqlserver,1433;Database=contentid;User Id=sa;Password=ContentId_local_2026!;Encrypt=True;TrustServerCertificate=True
      ContentId__MongoConnectionString: mongodb://mongodb:27017
      ContentId__MongoDatabase: contentid
      ContentId__QueueName: content-id-job-queue
      ContentId__AwsServiceUrl: http://localstack:4566
      ContentId__AwsRegion: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "18080:8080"
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started

  content-match-worker-go:
    build:
      context: .
      dockerfile: src/content-match-worker-go/Dockerfile
    environment:
      SQLSERVER_CONNECTION_STRING: sqlserver://sa:ContentId_local_2026!@sqlserver:1433?database=contentid&encrypt=true&TrustServerCertificate=true
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017
      MONGO_DATABASE: contentid
      QUEUE_NAME: content-id-job-queue
      AWS_SERVICE_URL: http://localstack:4566
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      contentid-api:
        condition: service_started
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
