x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ContentId_local_2026!
    ports:
      - "11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"select 1\" -C -b"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ContentId_local_2026!
    command:
      [
        "bash",
        "-c",
        "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"if db_id(N'contentid') is null create database contentid;\" -C -b"
      ]
    logging: *default-logging

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    command: ["mongod", "--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 3s
      retries: 10
    logging: *default-logging

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,sns,s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo.yaml:ro
    logging: *default-logging

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yaml:ro
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "13000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18889:8889"
    depends_on:
      - tempo
      - loki
    logging: *default-logging

  contentid-api:
    build:
      context: .
      dockerfile: src/ContentId.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ContentId__SqlServerConnectionString: Server=sqlserver,1433;Database=contentid;User Id=sa;Password=ContentId_local_2026!;Encrypt=True;TrustServerCertificate=True
      ContentId__MongoConnectionString: mongodb://mongodb:27017
      ContentId__MongoDatabase: contentid
      ContentId__QueueName: content-id-job-queue
      ContentId__AwsServiceUrl: http://localstack:4566
      ContentId__AwsRegion: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "18080:8080"
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
    logging: *default-logging

  content-match-worker-go:
    build:
      context: .
      dockerfile: src/content-match-worker-go/Dockerfile
    environment:
      SQLSERVER_CONNECTION_STRING: sqlserver://sa:ContentId_local_2026!@sqlserver:1433?database=contentid&encrypt=true&TrustServerCertificate=true
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017
      MONGO_DATABASE: contentid
      QUEUE_NAME: content-id-job-queue
      AWS_SERVICE_URL: http://localstack:4566
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      contentid-api:
        condition: service_started
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
    logging: *default-logging
