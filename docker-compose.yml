services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: contentid
      POSTGRES_USER: contentid
      POSTGRES_PASSWORD: contentid
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentid -d contentid"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,sns,s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18889:8889"

  contentid-api:
    build:
      context: .
      dockerfile: src/ContentId.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ContentId__PostgresConnectionString: Host=postgres;Port=5432;Username=contentid;Password=contentid;Database=contentid
      ContentId__MongoConnectionString: mongodb://mongodb:27017
      ContentId__MongoDatabase: contentid
      ContentId__QueueName: content-id-job-queue
      ContentId__AwsServiceUrl: http://localstack:4566
      ContentId__AwsRegion: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started

  content-match-worker-go:
    build:
      context: .
      dockerfile: src/content-match-worker-go/Dockerfile
    environment:
      POSTGRES_CONNECTION_STRING: postgres://contentid:contentid@postgres:5432/contentid?sslmode=disable
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017
      MONGO_DATABASE: contentid
      QUEUE_NAME: content-id-job-queue
      AWS_SERVICE_URL: http://localstack:4566
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      contentid-api:
        condition: service_started
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
